name: Test kernel install

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: Kernel version to build and install
        required: false
        default: 6.12.112
      mainline_version:
        description: Mainline (-rc) version to build and install with --mainline
        required: false
        default: 7.3-rc7
  push:
    branches: [main]
    paths:
      - kernel_installer.sh
      - src/slib.sh
      - .github/workflows/test-install.yml
  pull_request:
    paths:
      - kernel_installer.sh
      - src/slib.sh
      - .github/workflows/test-install.yml

permissions:
  contents: read

concurrency:
  group: test-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distro-detection:
    name: Detect ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Official Linux Mint images; they ship Mint's own /etc/issue.net
          # ("Linux Mint 21.3 Virginia", "LMDE 7 Gigi")
          - name: Linux Mint 21.3
            image: linuxmintd/mint21.3-amd64
          - name: LMDE 7
            image: linuxmintd/lmde7-amd64
    container:
      image: ${{ matrix.image }}
    env:
      TERM: xterm
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates curl lsb-release procps
      - uses: actions/checkout@v4
      - name: Detect distro and list installed kernels
        run: |
          set -u
          cat /etc/issue.net
          rc=0
          ./kernel_installer.sh --list-installed > /tmp/detect.log 2>&1 < /dev/null || rc=$?
          cat /tmp/detect.log
          if grep -qiE "unknown distro|not yet supported" /tmp/detect.log; then
            echo "FAIL: $(cat /etc/issue.net) was not recognized"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: --list-installed exited with $rc"
            exit 1
          fi
          echo "OK: distro detected as Debian family"

  install:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12 (bookworm)
            image: debian:12
            slug: debian-12
          - name: Debian 13 (trixie)
            image: debian:13
            slug: debian-13
          - name: Ubuntu 22.04 (jammy)
            image: ubuntu:22.04
            slug: ubuntu-22.04
          - name: Ubuntu 24.04 (noble)
            image: ubuntu:24.04
            slug: ubuntu-24.04
          - name: Fedora 44
            image: fedora:44
            slug: fedora-44
    container:
      image: ${{ matrix.image }}
    env:
      KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '6.12.112' }}
      TERM: xterm
    steps:
      - name: Install container prerequisites
        run: |
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y git ca-certificates procps-ng
          else
            apt-get update -qq
            # initramfs-tools lets the linux-image postinst generate /boot/initrd.img-<ver>
            apt-get install -y -qq git ca-certificates lsb-release procps initramfs-tools
          fi
      - uses: actions/checkout@v4
      - name: Show environment
        run: |
          cat /etc/os-release
          uname -r
          echo "cpus: $(nproc), memory: $(free -h | awk '/Mem:/ {print $2}')"
      - name: Build and install kernel ${{ env.KERNEL_VERSION }}
        run: ./kernel_installer.sh -k "${KERNEL_VERSION}"
      - name: Show installer log on failure
        if: failure()
        run: |
          echo "=== /var/log/kernel_installer.log (last 150 lines) ==="
          tail -n 150 /var/log/kernel_installer.log || true
      - name: Verify installation
        run: |
          set -ux
          ver="${KERNEL_VERSION}"
          if command -v dnf >/dev/null 2>&1; then
            rpm -qa 'kernel*' | grep "${ver}" || true
            ls -la /boot/ || true
            ls "/lib/modules/${ver}/kernel" | head || true
            set -e
            rpm -q "kernel-${ver}" >/dev/null
            rpm -q "kernel-devel-${ver}" >/dev/null
            test -f "/boot/vmlinuz-${ver}"
            test -f "/boot/config-${ver}"
            test -d "/lib/modules/${ver}/kernel"
            test -d "/usr/src/kernels/${ver}"
            test -f "/boot/initramfs-${ver}.img"
          else
            dpkg -l "linux-image-${ver}" "linux-headers-${ver}" || true
            ls -la /boot/ || true
            ls "/lib/modules/${ver}/kernel" | head || true
            set -e
            dpkg -s "linux-image-${ver}" >/dev/null
            dpkg -s "linux-headers-${ver}" >/dev/null
            test -f "/boot/vmlinuz-${ver}"
            test -f "/boot/config-${ver}"
            test -d "/lib/modules/${ver}/kernel"
            test -d "/usr/src/linux-headers-${ver}"
            test -f "/boot/initrd.img-${ver}"
          fi
          echo "Kernel ${ver} installed successfully on $(. /etc/os-release && echo "$PRETTY_NAME")"
      - name: Uninstall kernel ${{ env.KERNEL_VERSION }}
        run: |
          set -ux
          ver="${KERNEL_VERSION}"
          # The uninstall run starts a new log; keep the install log for the artifact
          cp /var/log/kernel_installer.log /tmp/kernel_installer.install.log
          rc=0
          # yes answers apt's purge confirmation (dnf runs with -y)
          yes | ./kernel_installer.sh --uninstall -k "${ver}" || rc=$?
          cat /var/log/kernel_installer.log || true
          cp /tmp/kernel_installer.install.log /var/log/kernel_installer.log
          test "$rc" -eq 0
          if command -v dnf >/dev/null 2>&1; then
            pkgs="kernel-${ver} kernel-devel-${ver}"
            check="rpm -q"
          else
            pkgs="linux-image-${ver} linux-headers-${ver}"
            check="dpkg -s"
          fi
          for p in $pkgs; do
            if $check "$p" >/dev/null 2>&1; then
              echo "FAIL: $p is still installed after --uninstall"
              exit 1
            fi
          done
          echo "Kernel ${ver} uninstalled"
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-installer-logs-${{ matrix.slug }}
          path: /var/log/kernel_installer.log
          if-no-files-found: ignore

  mainline:
    name: Mainline ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 (noble)
            image: ubuntu:24.04
            slug: ubuntu-24.04
          - name: Fedora 44
            image: fedora:44
            slug: fedora-44
    container:
      image: ${{ matrix.image }}
    env:
      # Pinned so the job does not follow whatever -rc kernel.org lists today;
      # this exercises the git.kernel.org snapshot download and the -rc
      # package version mangling (~rc for deb, _rc for rpm).
      MAINLINE_VER: ${{ github.event.inputs.mainline_version || '7.3-rc7' }}
      TERM: xterm
    steps:
      - name: Install container prerequisites
        run: |
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y git ca-certificates procps-ng
          else
            apt-get update -qq
            # initramfs-tools lets the linux-image postinst generate /boot/initrd.img-<ver>
            apt-get install -y -qq git ca-certificates lsb-release procps initramfs-tools
          fi
      - uses: actions/checkout@v4
      - name: Build and install mainline kernel ${{ env.MAINLINE_VER }}
        run: ./kernel_installer.sh --mainline
      - name: Show installer log on failure
        if: failure()
        run: |
          echo "=== /var/log/kernel_installer.log (last 150 lines) ==="
          tail -n 150 /var/log/kernel_installer.log || true
      - name: Verify installation
        run: |
          set -ux
          # 7.3-rc7 builds kernel release 7.3.0-rc7 (SUBLEVEL is 0 on mainline)
          base="${MAINLINE_VER%%-*}"
          extra="${MAINLINE_VER#"$base"}"
          case "$base" in *.*.*) ;; *) base="${base}.0" ;; esac
          ver="${base}${extra}"
          ls -la /boot/ || true
          set -e
          if command -v dnf >/dev/null 2>&1; then
            rpm -qa 'kernel*' | grep "${ver//-/_}" || true
            rpm -q "kernel-${ver//-/_}" >/dev/null
            rpm -q "kernel-devel-${ver//-/_}" >/dev/null
            test -d "/usr/src/kernels/${ver}"
            test -f "/boot/initramfs-${ver}.img"
          else
            dpkg -l "linux-image-${ver}" "linux-headers-${ver}" || true
            dpkg -s "linux-image-${ver}" >/dev/null
            dpkg -s "linux-headers-${ver}" >/dev/null
            test -d "/usr/src/linux-headers-${ver}"
            test -f "/boot/initrd.img-${ver}"
          fi
          test -f "/boot/vmlinuz-${ver}"
          test -f "/boot/config-${ver}"
          test -d "/lib/modules/${ver}/kernel"
          echo "Mainline kernel ${ver} installed successfully on $(. /etc/os-release && echo "$PRETTY_NAME")"
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-installer-logs-mainline-${{ matrix.slug }}
          path: /var/log/kernel_installer.log
          if-no-files-found: ignore

  custom-config-smoke:
    name: Custom config smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ubuntu:24.04
    env:
      KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '6.12.112' }}
      TERM: xterm
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update -qq
          # initramfs-tools lets the linux-image postinst generate /boot/initrd.img-<ver>
          apt-get install -y -qq git ca-certificates lsb-release procps initramfs-tools
      - uses: actions/checkout@v4
      - name: Reject malformed --custom-config values
        run: |
          set -eux
          # a missing value must abort immediately
          if ./kernel_installer.sh --custom-config >/tmp/cc-missing.log 2>&1; then
            echo "FAIL: --custom-config without a value was accepted"
            exit 1
          fi
          grep -q "requires an argument" /tmp/cc-missing.log
          # a raw CONFIG_FOO=y assignment is not a scripts/config command and must abort
          if ./kernel_installer.sh -cc 'CONFIG_FOO=y' >/tmp/cc-raw.log 2>&1; then
            echo "FAIL: raw CONFIG_FOO=y was accepted"
            exit 1
          fi
          grep -q "expects a scripts/config command" /tmp/cc-raw.log
          echo "Fast validation checks passed"
      - name: Build and install kernel ${{ env.KERNEL_VERSION }} with custom config
        run: ./kernel_installer.sh -k "${KERNEL_VERSION}" -cc 'scripts/config --set-str DEFAULT_HOSTNAME cc-smoke' -cc 'scripts/config --set-val PANIC_TIMEOUT 42'
      - name: Show installer log on failure
        if: failure()
        run: |
          echo "=== /var/log/kernel_installer.log (last 150 lines) ==="
          tail -n 150 /var/log/kernel_installer.log || true
      - name: Verify custom config applied
        run: |
          set -eux
          ver="${KERNEL_VERSION}"
          dpkg -s "linux-image-${ver}" >/dev/null
          test -f "/boot/config-${ver}"
          grep -q '^CONFIG_DEFAULT_HOSTNAME="cc-smoke"$' "/boot/config-${ver}"
          grep -q '^CONFIG_PANIC_TIMEOUT=42$' "/boot/config-${ver}"
          echo "Custom config directives verified in /boot/config-${ver}"
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-installer-logs-custom-config-smoke
          path: /var/log/kernel_installer.log
          if-no-files-found: ignore
