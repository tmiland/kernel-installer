name: Test kernel install

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: Kernel version to build and install
        required: false
        default: 6.12.112
      mainline_version:
        description: Mainline (-rc) version to build and install with --mainline
        required: false
        default: 7.3-rc7
  schedule:
    # Weekly, off the hour (#43): the kernel.org stable release moves on its
    # own, so a new kernel that breaks the build must show up without anyone
    # opening a PR. The pinned jobs below are skipped for this event; their
    # coverage is the point of the latest-install jobs instead.
    - cron: '23 5 * * 1'
  push:
    branches: [main]
    paths:
      - kernel_installer.sh
      - src/slib.sh
      - .github/workflows/test-install.yml
  pull_request:
    paths:
      - kernel_installer.sh
      - src/slib.sh
      - .github/workflows/test-install.yml

permissions:
  contents: read

concurrency:
  # The event name keeps the weekly schedule from cancelling an in-flight
  # main/PR run that shares this ref (#43).
  group: test-install-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  distro-detection:
    name: Detect ${{ matrix.name }}
    # A scheduled run covers current-stable installs only (#43); detection
    # against the official Mint/LMDE images still runs for main and PRs.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Official Linux Mint images; they ship Mint's own /etc/issue.net
          # ("Linux Mint 21.3 Virginia", "LMDE 7 Gigi")
          - name: Linux Mint 21.3
            image: linuxmintd/mint21.3-amd64
          - name: LMDE 7
            image: linuxmintd/lmde7-amd64
    container:
      image: ${{ matrix.image }}
    env:
      TERM: xterm
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates curl lsb-release procps
      - uses: actions/checkout@v4
      - name: Detect distro and list installed kernels
        run: |
          set -u
          cat /etc/issue.net
          rc=0
          ./kernel_installer.sh --list-installed > /tmp/detect.log 2>&1 < /dev/null || rc=$?
          cat /tmp/detect.log
          if grep -qiE "unknown distro|not yet supported" /tmp/detect.log; then
            echo "FAIL: $(cat /etc/issue.net) was not recognized"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: --list-installed exited with $rc"
            exit 1
          fi
          echo "OK: distro detected as Debian family"

  install:
    name: ${{ matrix.name }}
    # Pinned to one version on purpose so PR checks stay reproducible; the
    # scheduled run defers to latest-install instead (#43).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12 (bookworm)
            image: debian:12
            slug: debian-12
            install_dir: ""
          - name: Debian 13 (trixie)
            image: debian:13
            slug: debian-13
            install_dir: ""
          - name: Ubuntu 22.04 (jammy)
            image: ubuntu:22.04
            slug: ubuntu-22.04
            install_dir: ""
          - name: Ubuntu 24.04 (noble)
            image: ubuntu:24.04
            slug: ubuntu-24.04
            install_dir: --dir ki-build
          - name: Fedora 44
            image: fedora:44
            slug: fedora-44
            install_dir: ""
    container:
      image: ${{ matrix.image }}
    env:
      KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '6.12.112' }}
      TERM: xterm
      # An exported TMPDIR must not be clobbered by the verified download and
      # must still work for the build steps afterwards (#48). Container-local
      # path on purpose: runner.temp is a host path, while this directory
      # persists across the job's steps inside the container.
      TMPDIR: /tmp/ki-tmp
      # Ubuntu 24.04 exercises a relative --dir (#51); the other jobs use the
      # default install directory.
      INSTALL_DIR_ARG: ${{ matrix.install_dir }}
    steps:
      - name: Install container prerequisites
        run: |
          mkdir -p "${TMPDIR:?}"
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y git ca-certificates procps-ng
          else
            apt-get update -qq
            # initramfs-tools lets the linux-image postinst generate /boot/initrd.img-<ver>
            apt-get install -y -qq git ca-certificates lsb-release procps initramfs-tools
          fi
      - uses: actions/checkout@v4
      - name: Show environment
        run: |
          cat /etc/os-release
          uname -r
          echo "cpus: $(nproc), memory: $(free -h | awk '/Mem:/ {print $2}')"
      - name: Build and install kernel ${{ env.KERNEL_VERSION }}
        run: ./kernel_installer.sh -k "${KERNEL_VERSION}" ${INSTALL_DIR_ARG:-}
      - name: Show installer log on failure
        if: failure()
        run: |
          echo "=== /var/log/kernel_installer.log (last 150 lines) ==="
          tail -n 150 /var/log/kernel_installer.log || true
      - name: Verify installation
        run: |
          set -ux
          ver="${KERNEL_VERSION}"
          if command -v dnf >/dev/null 2>&1; then
            rpm -qa 'kernel*' | grep "${ver}" || true
            ls -la /boot/ || true
            ls "/lib/modules/${ver}/kernel" | head || true
            set -e
            rpm -q "kernel-${ver}" >/dev/null
            rpm -q "kernel-devel-${ver}" >/dev/null
            test -f "/boot/vmlinuz-${ver}"
            test -f "/boot/config-${ver}"
            test -d "/lib/modules/${ver}/kernel"
            test -d "/usr/src/kernels/${ver}"
            test -f "/boot/initramfs-${ver}.img"
          else
            dpkg -l "linux-image-${ver}" "linux-headers-${ver}" || true
            ls -la /boot/ || true
            ls "/lib/modules/${ver}/kernel" | head || true
            set -e
            dpkg -s "linux-image-${ver}" >/dev/null
            dpkg -s "linux-headers-${ver}" >/dev/null
            test -f "/boot/vmlinuz-${ver}"
            test -f "/boot/config-${ver}"
            test -d "/lib/modules/${ver}/kernel"
            test -d "/usr/src/linux-headers-${ver}"
            test -f "/boot/initrd.img-${ver}"
          fi
          if [ -n "${INSTALL_DIR_ARG:-}" ]; then
            # --dir was given as a relative path (#51): it must have been
            # resolved at argument parsing, before the build changes directory.
            # The success path removes $INSTALL_DIR, so verify via the install
            # log: the archive was downloaded under the invocation directory.
            grep -q "Downloaded and verified .*ki-build/linux-kernel/linux-${ver}\.tar\.xz" /var/log/kernel_installer.log
          fi
          echo "Kernel ${ver} installed successfully on $(. /etc/os-release && echo "$PRETTY_NAME")"
      - name: Uninstall kernel ${{ env.KERNEL_VERSION }}
        run: |
          set -ux
          ver="${KERNEL_VERSION}"
          # --uninstall appends to the install log (only an install starts a
          # new one), so show just the lines it adds
          log_lines=$(wc -l < /var/log/kernel_installer.log)
          rc=0
          # yes answers apt's purge confirmation (dnf runs with -y)
          yes | ./kernel_installer.sh --uninstall -k "${ver}" || rc=$?
          tail -n +"$((log_lines + 1))" /var/log/kernel_installer.log || true
          test "$rc" -eq 0
          if command -v dnf >/dev/null 2>&1; then
            pkgs="kernel-${ver} kernel-devel-${ver}"
            check="rpm -q"
          else
            pkgs="linux-image-${ver} linux-headers-${ver}"
            check="dpkg -s"
          fi
          for p in $pkgs; do
            if $check "$p" >/dev/null 2>&1; then
              echo "FAIL: $p is still installed after --uninstall"
              exit 1
            fi
          done
          echo "Kernel ${ver} uninstalled"
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-installer-logs-${{ matrix.slug }}
          path: /var/log/kernel_installer.log
          if-no-files-found: ignore

  mainline:
    name: Mainline ${{ matrix.name }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 (noble)
            image: ubuntu:24.04
            slug: ubuntu-24.04
          - name: Fedora 44
            image: fedora:44
            slug: fedora-44
    container:
      image: ${{ matrix.image }}
    env:
      # Pinned so the job does not follow whatever -rc kernel.org lists today;
      # this exercises the git.kernel.org snapshot download and the -rc
      # package version mangling (~rc for deb, _rc for rpm).
      MAINLINE_VER: ${{ github.event.inputs.mainline_version || '7.3-rc7' }}
      TERM: xterm
    steps:
      - name: Install container prerequisites
        run: |
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y git ca-certificates procps-ng
          else
            apt-get update -qq
            # initramfs-tools lets the linux-image postinst generate /boot/initrd.img-<ver>
            apt-get install -y -qq git ca-certificates lsb-release procps initramfs-tools
          fi
      - uses: actions/checkout@v4
      - name: Build and install mainline kernel ${{ env.MAINLINE_VER }}
        run: ./kernel_installer.sh --mainline
      - name: Show installer log on failure
        if: failure()
        run: |
          echo "=== /var/log/kernel_installer.log (last 150 lines) ==="
          tail -n 150 /var/log/kernel_installer.log || true
      - name: Verify installation
        run: |
          set -ux
          # 7.3-rc7 builds kernel release 7.3.0-rc7 (SUBLEVEL is 0 on mainline)
          base="${MAINLINE_VER%%-*}"
          extra="${MAINLINE_VER#"$base"}"
          case "$base" in *.*.*) ;; *) base="${base}.0" ;; esac
          ver="${base}${extra}"
          ls -la /boot/ || true
          set -e
          if command -v dnf >/dev/null 2>&1; then
            rpm -qa 'kernel*' | grep "${ver//-/_}" || true
            rpm -q "kernel-${ver//-/_}" >/dev/null
            rpm -q "kernel-devel-${ver//-/_}" >/dev/null
            test -d "/usr/src/kernels/${ver}"
            test -f "/boot/initramfs-${ver}.img"
          else
            dpkg -l "linux-image-${ver}" "linux-headers-${ver}" || true
            dpkg -s "linux-image-${ver}" >/dev/null
            dpkg -s "linux-headers-${ver}" >/dev/null
            test -d "/usr/src/linux-headers-${ver}"
            test -f "/boot/initrd.img-${ver}"
          fi
          test -f "/boot/vmlinuz-${ver}"
          test -f "/boot/config-${ver}"
          test -d "/lib/modules/${ver}/kernel"
          echo "Mainline kernel ${ver} installed successfully on $(. /etc/os-release && echo "$PRETTY_NAME")"
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-installer-logs-mainline-${{ matrix.slug }}
          path: /var/log/kernel_installer.log
          if-no-files-found: ignore

  custom-config-smoke:
    name: Custom config smoke test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ubuntu:24.04
    env:
      KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '6.12.112' }}
      TERM: xterm
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update -qq
          # initramfs-tools lets the linux-image postinst generate /boot/initrd.img-<ver>
          apt-get install -y -qq git ca-certificates lsb-release procps initramfs-tools
      - uses: actions/checkout@v4
      - name: Reject malformed --custom-config values
        run: |
          set -eux
          # a missing value must abort immediately
          if ./kernel_installer.sh --custom-config >/tmp/cc-missing.log 2>&1; then
            echo "FAIL: --custom-config without a value was accepted"
            exit 1
          fi
          grep -q "requires an argument" /tmp/cc-missing.log
          # a raw CONFIG_FOO=y assignment is not a scripts/config command and must abort
          if ./kernel_installer.sh -cc 'CONFIG_FOO=y' >/tmp/cc-raw.log 2>&1; then
            echo "FAIL: raw CONFIG_FOO=y was accepted"
            exit 1
          fi
          grep -q "expects a scripts/config command" /tmp/cc-raw.log
          echo "Fast validation checks passed"
      - name: Build and install kernel ${{ env.KERNEL_VERSION }} with custom config
        run: ./kernel_installer.sh -k "${KERNEL_VERSION}" -cc 'scripts/config --set-str DEFAULT_HOSTNAME cc-smoke' -cc 'scripts/config --set-val PANIC_TIMEOUT 42'
      - name: Show installer log on failure
        if: failure()
        run: |
          echo "=== /var/log/kernel_installer.log (last 150 lines) ==="
          tail -n 150 /var/log/kernel_installer.log || true
      - name: Verify custom config applied
        run: |
          set -eux
          ver="${KERNEL_VERSION}"
          dpkg -s "linux-image-${ver}" >/dev/null
          test -f "/boot/config-${ver}"
          grep -q '^CONFIG_DEFAULT_HOSTNAME="cc-smoke"$' "/boot/config-${ver}"
          grep -q '^CONFIG_PANIC_TIMEOUT=42$' "/boot/config-${ver}"
          echo "Custom config directives verified in /boot/config-${ver}"
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-installer-logs-custom-config-smoke
          path: /var/log/kernel_installer.log
          if-no-files-found: ignore

  # Issue #43: every other job here passes -k, --mainline or --custom-config,
  # so none of them installs the way a user does -- and a Fedora install of a
  # *current* kernel broke with no job noticing. These jobs run
  # `./kernel_installer.sh` with no arguments at all, which installs whatever
  # kernel.org calls stable at that moment.
  latest-install:
    name: Latest stable ${{ matrix.name }}
    # Scheduled weekly and runnable by hand, but deliberately not part of PR
    # checks: those stay reproducible and independent of kernel.org's current
    # release. Runs from the default branch's copy of this file.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora 44
            image: fedora:44
            slug: fedora-44
          - name: Debian 13 (trixie)
            image: debian:13
            slug: debian-13
    container:
      image: ${{ matrix.image }}
    env:
      TERM: xterm
      # Same container-local TMPDIR as the pinned install jobs (#48): an
      # exported TMPDIR must not be clobbered by the verified download.
      TMPDIR: /tmp/ki-tmp
    steps:
      - name: Install container prerequisites
        run: |
          mkdir -p "${TMPDIR:?}"
          # curl is required here: with no arguments the installer resolves the
          # current stable version from kernel.org (#43), and debian:13 ships
          # neither curl nor wget, which made the run fail as a bogus "check
          # your network connection" error.
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y git ca-certificates procps-ng curl
          else
            apt-get update -qq
            # initramfs-tools lets the linux-image postinst generate /boot/initrd.img-<ver>
            apt-get install -y -qq git ca-certificates lsb-release procps initramfs-tools curl
          fi
      - uses: actions/checkout@v4
      - name: Show environment
        run: |
          cat /etc/os-release
          uname -r
          echo "cpus: $(nproc), memory: $(free -h | awk '/Mem:/ {print $2}')"
      - name: Build and install the current stable kernel (no arguments)
        run: ./kernel_installer.sh
      - name: Show installer log on failure
        if: failure()
        run: |
          echo "=== /var/log/kernel_installer.log (last 150 lines) ==="
          tail -n 150 /var/log/kernel_installer.log || true
      - name: Verify installation
        run: |
          set -ux
          # No version was requested, so read the installed release back from
          # the build output rather than assuming one.
          set -- /boot/vmlinuz-*
          if [ "$#" -ne 1 ]; then
            echo "FAIL: expected exactly one /boot/vmlinuz-*, found $#"
            exit 1
          fi
          ver="${1##*/vmlinuz-}"
          echo "Installed kernel release: ${ver}"
          case "$ver" in
            *.*.*) ;;
            *) echo "FAIL: '${ver}' is not an x.y.z release"; exit 1 ;;
          esac
          if [ "$ver" = "6.12.112" ]; then
            echo "FAIL: the no-argument install used the pinned 6.12.112, not current stable"
            exit 1
          fi
          # The release that was built must be the one that was downloaded and
          # PGP-verified, not something the packaging layer rewrote. kernel.org
          # drops the trailing .0 from point-zero stable tarballs (release 7.3.0
          # ships as linux-7.3.tar.xz), so match that name.
          tarball_ver="${ver%.0}"
          grep -q "Downloaded and verified .*linux-${tarball_ver}\.tar\.xz" /var/log/kernel_installer.log
          if command -v dnf >/dev/null 2>&1; then
            rpm -qa 'kernel*' | grep "${ver}" || true
            ls -la /boot/ || true
            ls "/lib/modules/${ver}/kernel" | head || true
            set -e
            rpm -q "kernel-${ver}" >/dev/null
            rpm -q "kernel-devel-${ver}" >/dev/null
            test -d "/usr/src/kernels/${ver}"
            test -f "/boot/initramfs-${ver}.img"
          else
            dpkg -l "linux-image-${ver}" "linux-headers-${ver}" || true
            ls -la /boot/ || true
            ls "/lib/modules/${ver}/kernel" | head || true
            set -e
            dpkg -s "linux-image-${ver}" >/dev/null
            dpkg -s "linux-headers-${ver}" >/dev/null
            test -d "/usr/src/linux-headers-${ver}"
            test -f "/boot/initrd.img-${ver}"
          fi
          test -f "/boot/vmlinuz-${ver}"
          test -f "/boot/config-${ver}"
          test -d "/lib/modules/${ver}/kernel"
          echo "Current stable kernel ${ver} installed successfully on $(. /etc/os-release && echo "$PRETTY_NAME")"
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-installer-logs-latest-${{ matrix.slug }}
          path: /var/log/kernel_installer.log
          if-no-files-found: ignore
